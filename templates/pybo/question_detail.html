<h1>{{ question.subject }}</h1>
<div>
    {{ question.content }}
</div>

<h5>{{ question.answer_set.count }}개의 답변이 있습니다.</h5>
<div>
    <ul>
        {% for answer in question.answer_set.all %}
            <li>{{answer.content}}</li>
        {% endfor %}
    </ul>
</div>

<form action="{% url 'pybo:answer_create' question.id %}" method="post">
{% csrf_token %}
<textarea name="content" id="content" rows="15"></textarea>      <!-- 텍스트 창 생성 -->
   <!--  텍스트창 이름 content/ 텍스트창 id는 content/ 행15개 -->
<input type="submit" value="답변등록">          <!-- 버튼 생성 -->
        <!-- 전송기능, ‘답변등록’버튼 -->
</form>
